avg:
  heading: Gegevensverwerking & AVG
  paragraphs:
    - Verwerking vindt plaats binnen de EER. Exacte datalocaties staan in de verwerkersovereenkomst.
    - Voor werk waarbij wij persoonsgegevens verwerken, sluiten we een verwerkersovereenkomst af. Een lijst van subverwerkers is op aanvraag beschikbaar.
  dpaLinkLabel: "Verwerkersovereenkomst downloaden [wanneer beschikbaar]"
  subprocessorsNote: Subverwerkerslijst op aanvraag.
  privacyContact: "Privacyvragen: [privacycontact e-mailadres]"
aiAct:
  heading: EU AI Act
  paragraphs:
    - Voor elke AI-oplossing die we bouwen, bepalen we eerst de risicoclassificatie onder de EU AI Act. Documentatie en logging horen standaard bij de oplossing, niet als losse toevoeging achteraf.
    - Menselijke controle is ingebouwd op de punten waar dat hoort. Voor hoog-risico-toepassingen richten we de oplossing in conform de eisen van de verordening.
