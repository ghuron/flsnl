avg:
  heading: Data processing & GDPR
  paragraphs:
    - Processing takes place within the EEA. Exact data locations are stated in the data processing agreement.
    - For work where we process personal data, we sign a data processing agreement. A list of sub-processors is available on request.
  dpaLinkLabel: "Download the data processing agreement [once available]"
  subprocessorsNote: Sub-processor list available on request.
  privacyContact: "Privacy questions: [privacy contact email]"
aiAct:
  heading: EU AI Act
  paragraphs:
    - For every AI solution we build, we first determine the risk classification under the EU AI Act. Documentation and logging are standard, not bolted on afterward.
    - Human review is built in at the points where it belongs. For high-risk applications, we design the solution to meet the requirements of the regulation.
