whatItIs:
  heading: Wat het is
  paragraphs:
    - Extractie en classificatie van facturen, orders, rapporten en formulieren. Elk documenttype krijgt een gemeten nauwkeurigheid — geen slag om de arm, een percentage dat we bijhouden.
    - Waar de nauwkeurigheid net niet hoog genoeg is voor volledige automatisering, blijft een mens de laatste controle doen. Dat is geen tekortkoming die we verstoppen, maar een keuze die we vooraf met je maken.
howItLooks:
  heading: Hoe het eruitziet in jouw omgeving
  paragraphs:
    - De oplossing draait in je eigen Azure-tenant, gekoppeld aan de systemen waar de documenten nu al binnenkomen. Niets verlaat jouw omgeving om ergens anders verwerkt te worden.
    - Elke run wordt gelogd en geëvalueerd, zodat je op elk moment kunt zien waar de nauwkeurigheid staat. Het ontwerp is EU AI Act-conform vanaf de eerste regel code, niet als losse toevoeging achteraf.
howWeStart:
  heading: Zo starten we
  body: We beginnen met een vaste-scope traject van 4-6 weken — werkende software in jouw eigen Azure-omgeving, met een evaluatierapport met gemeten prestaties. Daarna draaien we door en betaal je per verwerkt document.
  linkLabel: Bekijk het aanbod
cases:
  heading: Bewezen in de praktijk
  body: Documentautomatisering voor commerce en logistiek — orders, catalogi en documentstromen die nu zichzelf verwerken.
  linkLabel: Bekijk de cases
faq:
  heading: Veelgestelde vragen
  items:
    - question: Hoe nauwkeurig is de extractie?
      answer: Dat meten we per documenttype en rapporteren we eerlijk, inclusief de documenten waar een mens nog naar moet kijken. Geen verborgen foutmarge.
    - question: Wat als het niet goed genoeg werkt voor mijn documenten?
      answer: Dan zeggen we dat na de eerste 4-6 weken, met het evaluatierapport als bewijs — niet pas na een lange implementatie.
    - question: Wie is eigenaar van de data?
      answer: Jij. De oplossing draait in jouw eigen Azure-tenant; wij bouwen en beheren, maar de data en de omgeving blijven van jou.
    - question: Hoe lang duurt het traject?
      answer: De eerste werkende versie staat er binnen 4-6 weken. Daarna is het een kwestie van doorontwikkelen en per verwerkte eenheid betalen.
    - question: Wat kost het ongeveer?
      answer: De vaste-scope start en het beheer per verwerkte eenheid staan met prijsindicatie op de aanbodpagina.
