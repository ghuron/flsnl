whatItIs:
  heading: Wat het is
  paragraphs:
    - AI-agents die repeterende workflows overnemen — orderinvoer, documentstromen, klantprocessen. Werk dat nu handmatig en voorspelbaar is, wordt door een agent afgehandeld volgens vooraf afgesproken regels.
    - De mens blijft eindverantwoordelijk. Een agent voert uit binnen grenzen die jij vooraf bepaalt, en escaleert zodra iets buiten die grenzen valt.
howItLooks:
  heading: Hoe het eruitziet in jouw omgeving
  paragraphs:
    - De agents draaien in je eigen Azure-tenant, gekoppeld aan de systemen waar het proces nu al plaatsvindt. Elke actie wordt gelogd, zodat je kunt zien wat de agent deed en waarom.
    - Het ontwerp is EU AI Act-conform vanaf de eerste regel code, met menselijke controle ingebouwd op de punten waar dat hoort.
howWeStart:
  heading: Zo starten we
  body: We beginnen met een vaste-scope traject van 4-6 weken — een werkende agent in jouw eigen Azure-omgeving, met een evaluatierapport met gemeten prestaties. Daarna draaien we door en betaal je per verwerkte eenheid.
  linkLabel: Bekijk het aanbod
cases:
  heading: Bewezen in de praktijk
  body: Catalogus-, order- en documentautomatisering voor commerce en logistiek.
  linkLabel: Bekijk de cases
faq:
  heading: Veelgestelde vragen
  items:
    - question: Wat gebeurt er als de agent iets niet zeker weet?
      answer: Dan escaleert hij naar een mens in plaats van te gokken. Waar die grens ligt, spreken we vooraf met je af.
    - question: Wat als het proces te complex blijkt voor automatisering?
      answer: Dan zeggen we dat na de eerste 4-6 weken, met het evaluatierapport als bewijs — niet pas na een lange implementatie.
    - question: Wie is eindverantwoordelijk voor wat de agent doet?
      answer: De mens blijft eindverantwoordelijk. De agent voert uit binnen grenzen die jij bepaalt, en elke actie is te herleiden.
    - question: Hoe lang duurt het traject?
      answer: De eerste werkende agent staat er binnen 4-6 weken. Daarna is het een kwestie van doorontwikkelen en per verwerkte eenheid betalen.
    - question: Wat kost het ongeveer?
      answer: De vaste-scope start en het beheer per verwerkte eenheid staan met prijsindicatie op de aanbodpagina.
