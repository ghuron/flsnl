whatItIs:
  heading: What it is
  paragraphs:
    - AI agents that take over repetitive workflows — order entry, document flows, customer processes. Work that's currently manual and predictable gets handled by an agent following rules agreed in advance.
    - The human stays accountable. An agent operates within boundaries you set upfront, and escalates the moment something falls outside them.
howItLooks:
  heading: What it looks like in your environment
  paragraphs:
    - The agents run in your own Azure tenant, connected to the systems where the process already happens. Every action is logged, so you can see what the agent did and why.
    - It's designed to be EU AI Act-compliant from the first line of code, with human review built in at the points where it belongs.
howWeStart:
  heading: How we start
  body: We start with a fixed-scope engagement of 4-6 weeks — a working agent in your own Azure environment, with an evaluation report of measured performance. From there we keep going, and you pay per unit processed.
  linkLabel: See the offer
cases:
  heading: Proven in practice
  body: Catalog, order and document automation for commerce and logistics.
  linkLabel: See the cases
faq:
  heading: Frequently asked questions
  items:
    - question: What happens when the agent isn't sure about something?
      answer: It escalates to a human instead of guessing. Where that boundary sits is something we agree with you upfront.
    - question: What if the process turns out too complex to automate?
      answer: We'll say so after the first 4-6 weeks, backed by the evaluation report — not after a long implementation.
    - question: Who's accountable for what the agent does?
      answer: The human stays accountable. The agent operates within boundaries you set, and every action can be traced.
    - question: How long does the engagement take?
      answer: The first working agent is there within 4-6 weeks. From there it's a matter of further development and paying per unit processed.
    - question: What does it roughly cost?
      answer: The fixed-scope start and the per-unit run pricing are on the offers page with a price indication.
cta:
  heading: Talk through your workflow
  name: Andrei Zaikin
  role: Netherlands contact
  bookingHref: "[booking link]"
  bookingLabel: Book a call
  responsePromise: We reply within one business day — even when the answer is that we can't help.
