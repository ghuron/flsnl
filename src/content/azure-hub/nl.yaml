meta:
  title: Azure-kosten besparen — First Line Software
  description: "Twee manieren om je Azure-kosten te verlagen: een gratis self-service scan in je eigen browser, en een mensgeleide audit die er een gekwantificeerde besparingscase van maakt."
heading: Azure-kosten besparen
intro: Twee stappen, en je kunt bij stap 1 beginnen zonder met ons te praten. De gratis scan draait volledig in je eigen browser en laat zien waar je budget lekt. Wil je daarna zekerheid over de bedragen en een plan om ze binnen te halen, dan is de audit de volgende stap.
steps:
  - eyebrow: Stap 1
    heading: "Azure Waste Scan: gratis self-scan"
    body: Upload je Azure-kostenexport en zie binnen enkele minuten waar je budget weglekt. Je bestand verlaat je browser nooit — er wordt niets verstuurd, dus wij zien je cijfers niet en weten niet eens dat je de scan hebt gedraaid.
    price: Gratis · 2 minuten
    linkLabel: Doe de gratis scan
    target: azureScan
  - eyebrow: Stap 2
    heading: "Azure Re-Engineering Audit: mensgeleide analyse"
    body: Onze engineers duiken in je verbruik, valideren wat er te halen valt en leveren een gekwantificeerde besparingsinventaris met een ondertekende meetmethodiek — plus een lijst AI-use-cases die je uit die besparing kunt financieren.
    price: €12.000 · 2 weken
    linkLabel: Bekijk de audit
    target: azureAudit
why:
  heading: Waarom wij hiernaar kijken
  paragraphs:
    - "First Line Software is een softwarebedrijf, geen kostenadviesbureau. We zoeken naar software die het waard is om opnieuw te bouwen: applicaties die dag en nacht op volle grootte draaien terwijl ze met de vraag mee zouden kunnen schalen."
    - "Een deel van wat we vinden is eenvoudig — resources uitzetten, een configuratie aanpassen. Dat kan je eigen team, en we zeggen dat er ook bij. Maar zit de verspilling ingebakken in hoe de applicatie werkt, dan is dat engineering: ons soort werk."
cta:
  heading: Praat over je Azure-rekening
  name: Larisa Koroteeva
  role: Client Relations Manager
  bookingHref: "[boekingslink Larisa]"
  bookingLabel: Plan een gesprek
  responsePromise: We reageren binnen één werkdag — ook als het antwoord is dat we je niet kunnen helpen.
  photoSrc: /assets/img/photo-larisa-koroteeva.jpg
