meta:
  title: Azure Waste Scan — run the scan in your own browser
  description: Open your Azure usage file, analyze it, and generate a report — entirely in your browser. No account, no upload, no server.
hero:
  eyebrow: No account. No upload.
  headlinePre: "See your Azure waste. Share "
  headlineEm: nothing
  headlinePost: " to do it."
  lede: One usage file, two minutes, zero data leaving your screen. The scan runs entirely in your own browser.
  ctaPrimary:
    label: Start the analysis
    href: "#scan"
  ctaGhost:
    label: How to export your usage
    href: "#export"
steps:
  heading: Three steps, two minutes
  items:
    - Get your monthly usage file from Microsoft.
    - Open it here — the scan runs locally, in your browser.
    - "Read the report: what stands out, and what it costs you to leave it be."
why:
  heading: Why this is different
  items:
    - strong: Free, and aimed at your AI budget.
      text: This scans your Azure billing CSV for spend that isn't earning its keep, so you can redirect it — toward AI, or wherever it's actually needed.
    - strong: Nothing leaves your browser.
      text: The analysis runs on your own screen. This page has no server to send anything to — checkable by anyone who reads the source. Feel free to turn off your wifi once the page has loaded.
    - strong: Two kinds of waste, and we tell them apart.
      text: Some of what we find is resources you don't need — a config change, done by your own IT team, no outside help required. Some of it is baked into how the application itself is built, which is a different problem.
    - strong: The second kind gets a suggestion, not a sale.
      text: If the scan turns up enough architectural waste, the report says so, and mentions that a human-led, AI-assisted audit is one way to dig into it further. Nothing happens after that unless you make it happen.
  trustLine: No account, no cookies, no tracking, nothing uploaded — so this comes with nothing to owe. Fix it yourself, call us, or do neither. We won't know which, and it won't change what the report told you.
export:
  heading: How to export your usage
  intro: "This takes about two minutes. You don't need access to production environments, and you're not sharing anything Microsoft doesn't already send you every month: your billing usage overview."
  direct:
    heading: Directly from Microsoft (pay-as-you-go / Microsoft Customer Agreement)
    steps:
      - Log in at portal.azure.com.
      - "Go to Cost Management + Billing → Invoices."
      - Download the monthly summary as CSV from the most recent invoice.
    noteMonthly: Choose the monthly summary, not the hourly one. The hourly one is bigger, more detailed than needed, and adds nothing the analysis can use.
    multiMonth: Multiple months? Download them all — you'll be able to open several CSV files at once and have them analyzed together.
    noteCSP: Paying through a reseller (CSP) or an Enterprise Agreement? The export works a bit differently. We'll add those paths soon — for now the scan is built around direct Microsoft billing as described above.
app:
  heading: The scan
  intro: Open your usage file(s) and hit analyze. Everything happens here, on your screen — nothing is sent anywhere.
  dropzone:
    title: Choose your CSV file(s)
    suffix: or drag them here
    hint: One or more Azure usage files — .csv
    ariaLabel: Choose or drag your CSV files
  analyzeLabel: Analyze
  saveLabel: Save report
  noscript: The scan runs on JavaScript in your own browser (still nothing is sent anywhere). Turn on JavaScript to analyze your file.
footer:
  text: First Line Software — the Azure Waste Scan runs entirely in your browser. No tracking, no cookies, no external requests.
  backLink:
    label: Back to home
    href: "/"
