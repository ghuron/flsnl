meta:
  title: Azure Waste Scan — First Line Software
  description: Free analysis of your Azure usage files, entirely in your browser. Find out what you're overpaying for — and what to do about it.
hero:
  eyebrow: Free Azure usage analysis
  headlinePre: "Why is your Azure bill so "
  headlineEm: big
  headlinePost: "?"
  lede: We analyze your Azure usage for free. Download your usage files, open them here, and walk away with leads worth investigating. Your files never leave your browser — we never see them.
  ctaPrimary:
    label: Start the analysis
    href: "#scan"
heroExportLinkLabel: Get your usage file in 30 seconds
expect:
  heading: What you'll get
  intro: "The scan reads your usage files and points at spending patterns worth a closer look. Not a verdict — a short list of leads, each with a number attached. The kind of questions it puts on the table:"
  items:
    - Why are we paying for everything 24×7 when we only use it 8×5?
    - Why is nearly all of our steady workload billed at on-demand rates, when reservations run 20–60% cheaper?
    - What caused last month's jump — and will it repeat?
    - Five resources carry most of the bill. Is each of them earning its keep?
    - A chunk of the bill has no tags. Who owns that spend?
files:
  heading: What's in an Azure usage file?
  paragraphs:
    - "An Azure usage file is the spreadsheet behind your monthly bill: one line per resource per period — its name, resource group, subscription, service type, and what it cost. Microsoft produces it every month whether anyone reads it or not."
    - "It deserves care: it contains resource and subscription names, cost figures, and tags — which sometimes carry the names of resource owners. It does not contain passwords, source code, or customer data."
    - Here it stays on your machine. The analysis runs entirely in your browser — and you don't have to take our word for it. Once your files are downloaded, switch your machine to flight mode and run the scan offline. It works exactly the same, because nothing here ever needs a connection.
  verifyNote: Want a second opinion on the numbers? Feed the same files to an AI model of your choice and compare the results — we're not worried about that comparison. Just know that, unlike this scan, doing so means the file leaves your browser, so weigh that trade-off yourself.
free:
  heading: Why is this free?
  paragraphs:
    - "First Line Software is a software engineering company. This scan is how we look for software worth re-engineering: applications that run at full size around the clock, but could scale with demand and cost a fraction of what they do."
    - Some of what the scan finds is simple — resources to switch off, a configuration to change. Your own team can do that, and the report says so. But when the waste is built into how the application works, that's engineering — our kind of work. If those leads look economically meaningful, come back for a deeper analysis and, if the numbers hold, the re-engineering itself. Email Andrei Zaikin — you'll get a personal reply.
    - And since nothing you open here ever reaches us, we don't even know you ran the scan. There's no follow-up unless you start it.
export:
  heading: How to get your usage files
  intro: A few minutes in the Azure portal. You don't need access to production — just to the billing side.
  steps:
    - Log in at portal.azure.com and open Cost Management + Billing.
    - Open Cost analysis and set the scope to the subscription you want to look at.
    - Download as CSV.
  multiMonth: Multiple months? Download them all — you can open several files at once and they'll be analyzed together.
  noteRole: No access? Ask whoever manages your Azure for the Cost Management Reader role. It's read-only, and it's all you need.
connectivity:
  online: Online
  offline: Airplane mode
app:
  heading: The scan
  intro: Open your usage file(s) and hit analyze. Everything happens here, on your screen — nothing is sent anywhere.
  dropzone:
    title: Choose your CSV file(s)
    suffix: or drag them here
    hint: One or more Azure usage files — .csv
    ariaLabel: Choose or drag your CSV files
  sampleLabel: View a sample report
  analyzeLabel: Produce report
  loadError: The scanner couldn't load. Reload the page and try again.
  noscript: The scan runs on JavaScript in your own browser (still nothing is sent anywhere). Turn on JavaScript to analyze your file.
trust:
  body: "Your file never leaves your browser: nothing is sent anywhere, so there's nothing to process within the EEA or delete afterward. You don't need any credentials — just the file itself."
  privacyLabel: Privacy policy
  vertrouwenLabel: More on trust & compliance
bridge:
  heading: From waste to AI budget
  body: Do the leads from this scan look economically worth it? The Azure Waste Audit turns them into a quantified savings inventory — and a list of AI use cases you could fund from that savings.
  linkLabel: See the Azure Waste Audit
footer:
  text: First Line Software — source code and more on GitHub.
  backLink:
    label: Back to home
    href: "/en/"
