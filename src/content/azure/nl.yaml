    ariaLabel: Kies of sleep je CSV-bestanden
  sampleLabel: Bekijk een voorbeeldrapport
  analyzeLabel: Analyseer
  saveLabel: Rapport opslaan
  saveCsvLabel: Exporteer bevindingen (CSV)
  noscript: De scan draait op JavaScript in je eigen browser (er wordt nog steeds niets verzonden). Zet JavaScript aan om je bestand te analyseren.
