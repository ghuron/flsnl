meta:
  title: Azure Waste Scan — First Line Software
  description: Gratis analyse van je Azure-verbruiksbestanden, volledig in je browser. Ontdek waar je te veel voor betaalt — en wat je eraan kunt doen.
hero:
  eyebrow: Gratis Azure-verbruiksanalyse
  headlinePre: "Waarom is je Azure-rekening zo "
  headlineEm: hoog
  headlinePost: "?"
  lede: We analyseren je Azure-verbruik gratis. Download je verbruiksbestanden, open ze hier, en je loopt weg met aanknopingspunten die het onderzoeken waard zijn. Je bestanden verlaten nooit je browser — wij zien ze nooit.
  ctaPrimary:
    label: Start de analyse
    href: "#scan"
  ctaGhost:
    label: Zo kom je aan je verbruiksbestanden
    href: "#export"
expect:
  heading: Wat je krijgt
  intro: "De scan leest je verbruiksbestanden en wijst uitgavepatronen aan die een nadere blik verdienen. Geen oordeel — een korte lijst aanknopingspunten, elk met een bedrag erbij. Het soort vragen dat op tafel komt:"
  items:
    - Waarom betalen we voor alles 24×7, terwijl we het maar 8×5 gebruiken?
    - Waarom draait bijna al onze stabiele workload op on-demand tarief, terwijl reserveringen 20–60% goedkoper zijn?
    - Wat veroorzaakte de piek van vorige maand — en komt die terug?
    - Vijf resources dragen het grootste deel van de rekening. Verdient elk daarvan nog zijn plek?
    - Een deel van de rekening heeft geen tags. Van wie is die uitgave?
files:
  heading: Wat zit er in een Azure-verbruiksbestand?
  paragraphs:
    - "Een Azure-verbruiksbestand is het rekenblad achter je maandelijkse rekening: één regel per resource per periode — naam, resourcegroep, subscription, type dienst, en wat het kostte. Microsoft maakt het elke maand, of iemand het nu leest of niet."
    - "Het verdient zorgvuldigheid: het bevat namen van resources en subscriptions, kostenbedragen, en tags — die soms het e-mailadres van de resource-eigenaar bevatten. Het bevat geen wachtwoorden, broncode, of klantdata."
    - "Hier blijft het op je eigen machine. De analyse draait volledig in je browser — en dat hoef je niet op ons woord te geloven. Zodra je bestanden gedownload zijn, zet je je machine gerust in vliegtuigmodus en draai je de scan offline — die werkt precies hetzelfde, want er is nooit een verbinding nodig."
free:
  heading: Waarom is dit gratis?
  paragraphs:
    - "First Line Software is een softwarebedrijf. Deze scan is hoe we op zoek gaan naar software die het waard is om opnieuw te bouwen: applicaties die dag en nacht op volle grootte draaien, terwijl ze met de vraag mee zouden kunnen schalen — voor een fractie van de huidige kosten."
    - "Een deel van wat de scan vindt is eenvoudig — resources uitzetten, een configuratie aanpassen. Dat kan je eigen team, en het rapport zegt dat er ook bij. Maar als de verspilling ingebakken zit in hoe de applicatie werkt, is dat engineering — ons soort werk. Zien die aanknopingspunten er economisch de moeite waard uit, kom dan terug voor een diepere analyse en, als de cijfers standhouden, de herbouw zelf. Mail Andrei Zaikin — je krijgt persoonlijk antwoord."
    - "En omdat niets wat je hier opent ons ooit bereikt, weten we niet eens dat je de scan hebt gedraaid. Geen opvolging, tenzij jij die zelf start."
connectivity:
  online: Online
  offline: Vliegtuigmodus
export:
  heading: Zo kom je aan je verbruiksbestanden
  intro: Een paar minuten in de Azure-portal. Je hebt geen toegang tot productie nodig — alleen tot de facturatiekant.
  steps:
    - Log in op portal.azure.com en open Cost Management + Billing.
    - Open Cost analysis en zet het bereik op de subscription die je wilt bekijken.
    - Exporteer als CSV.
  multiMonth: Meerdere maanden? Download ze allemaal — je kunt straks meerdere bestanden tegelijk openen en samen laten analyseren.
  noteRole: Geen toegang? Vraag wie jullie Azure beheert om de rol Cost Management Reader. Die is alleen-lezen, en meer heb je niet nodig.
