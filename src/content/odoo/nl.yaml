heading: Odoo + AI-automatisering
intro: "Twee ingangen, één antwoord: wij bouwen AI-automatisering die op Odoo aansluit — of je nu zelf Odoo draait, of het als partner aan klanten levert."
audiences:
  - heading: Draai je zelf Odoo?
    body: Documentverwerking, data-ontsluiting en procesautomatisering die aansluiten op je bestaande Odoo-omgeving — vaste-scope start, werkende software in 4-6 weken.
  - heading: Ben je Odoo-partner?
    body: Wil je AI-automatisering aanbieden aan je klanten zonder zelf een AI-engineeringteam op te bouwen? Wij zijn de bank erachter — jij houdt het klantcontact.
