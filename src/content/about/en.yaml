history:
  heading: Our history
  paragraphs:
    - We come out of the early European agile movement — not a generic offshore bank of engineers, but teams that were used to building alongside the client from the start, not next to them.
    - "There's a part of our history we'd rather tell you ourselves than have you read it elsewhere: delivery from Russia was fully wound down in 2022. Since then we work exclusively from the EU and EU-candidate member states — Montenegro, Serbia, Slovakia, Czech Republic and Spain."
    - "[This paragraph is for the owner to fact-check for exact wording before publishing.]"
team:
  heading: Netherlands team
  members:
    - name: Larisa Koroteeva
      role: Client Relations Manager
      bio: "Larisa Koroteeva, Client Relations Manager, is First Line Software's first point of contact in the Netherlands — call, email, or book a call, and you'll reach her directly, no queue. She spent seven years running marketing and PR for First Line Software, building multi-channel campaigns and reading markets to reach the right audience and media contacts. Earlier in her career she arranged high-level negotiations for government officials and hosted diplomatic delegations — the same instinct for connecting the right people she now brings to client conversations."
      linkedinLabel: LinkedIn
      linkedinHref: https://www.linkedin.com/in/larisa-koroteeva-4056071b/
      bookingLabel: Book a call
      bookingHref: "[booking link Larisa]"
      certImageSrc: /assets/img/cert-claude-associate.png
      certImageAlt: Claude Certified Associate — Foundations
      photoSrc: /assets/img/photo-larisa-koroteeva.jpg
    - name: Andrei Zaikin
      role: Technical Fellow
      bio: "Andrei Zaikin, Technical Fellow, leads the technical side of First Line Software's Netherlands practice — the person to talk to once a project moves from conversation to architecture. He has 25+ years in Microsoft technologies, building and leading agile engineering teams and pushing developer productivity higher. He has turned complex requirements into working software for clients including Skattestyrelsen (the Danish Tax Agency), DaimlerChrysler, Intel, S&P and Deutsche Bank, and is known for standing up technical task forces and keeping delivery honest under agile project management."
      linkedinLabel: LinkedIn
      linkedinHref: https://www.linkedin.com/in/zaikin/
      bookingLabel: Book a call
      bookingHref: "https://calendar.app.google/VHBi1iERgW19Nrtv9"
      certImageSrc: /assets/img/cert-claude-architect.png
      certImageAlt: Claude Certified Architect — Foundations
      photoSrc: /assets/img/photo-andrei-zaikin.jpg
