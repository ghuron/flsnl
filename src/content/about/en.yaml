history:
  heading: Our history
  paragraphs:
    - We come out of the early European agile movement — not a generic offshore bank of engineers, but teams that were used to building alongside the client from the start, not next to them.
    - "There's a part of our history we'd rather tell you ourselves than have you read it elsewhere: delivery from Russia was fully wound down in 2022. Since then we work exclusively from the EU and EU-candidate member states — Montenegro, Serbia, Slovakia, Czech Republic and Spain."
