history:
  heading: Onze geschiedenis
  paragraphs:
    - We komen voort uit de vroege Europese agile-beweging — niet uit een generieke offshore-bank van engineers, maar uit teams die van meet af aan gewend waren om samen met de klant te bouwen, niet ernaast.
    - "Een deel van onze geschiedenis vertellen we liever zelf dan dat je het ergens anders leest: delivery vanuit Rusland is in 2022 volledig afgebouwd. Sindsdien werken we uitsluitend vanuit de EU en EU-kandidaat-lidstaten — Montenegro, Servië, Slowakije, Tsjechië en Spanje."
    - "[Deze paragraaf is door de eigenaar te controleren op exacte bewoording voordat publicatie.]"
