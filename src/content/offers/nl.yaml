meta:
  title: Aanbod & prijzen — First Line Software
  description: Vaste-scope start, echte prijzen, geen uurtje-factuurtje. Twee manieren om je Azure-kosten te verlagen — de gratis Waste Scan en de mensgeleide Waste Audit.
heading: Aanbod & prijzen
intro:
  body: "Elk traject begint met een vaste-scope start: een vast bedrag voor een vaste periode. Een evaluatierapport met gemeten prestaties hoort er altijd bij — en levert het niets op, dan zeggen we dat. We verkopen geen vervolgtraject op basis van een verhaal, alleen op basis van cijfers. Geen uurtje-factuurtje, geen open einde. AI die werk oplevert, geen slides."
tiles:
  - name: Azure Waste Scan
    tagline: Stap 1 — draai 'm zelf, in je eigen browser. Geen upload, geen aanmelding.
    whatYouGetLabel: "Wat je krijgt:"
    outcome: Inzicht binnen minuten
    outcomeBody: Een korte lijst aanknopingspunten met een bedrag per bevinding, als PDF. Je bestand verlaat je browser nooit — wij zien je cijfers niet.
    price: Gratis · 2 minuten
    ctaLabel: Doe de gratis scan
    target: azureScan
  - name: Azure Waste Audit
    tagline: Stap 2 — onze engineers duiken in je verbruik en valideren wat er echt te halen valt.
    whatYouGetLabel: "Wat je krijgt:"
    outcome: Een besparingscase die standhoudt
    outcomeBody: Gekwantificeerde besparingsinventaris met een ondertekende meetmethodiek, plus een lijst AI-use-cases die je uit die besparing kunt financieren.
    price: €7.500 – €12.500 · 2 weken
    ctaLabel: Bekijk de audit
    target: azureAudit
azureNote:
  body: "De twee horen bij elkaar: stap 1 laat zien of er iets te halen valt, stap 2 zet er bedragen bij die je kunt verdedigen."
  linkLabel: Bekijk de Azure-aanpak
