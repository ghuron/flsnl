meta:
  title: Aanbod & prijzen — First Line Software
  description: Vaste-scope start, beheer per verwerkte eenheid, geen uurtje-factuurtje. Bekijk onze productized offers met echte prijzen — inclusief de Azure Waste Audit.
heading: Aanbod & prijzen
intro:
  heading: Zo prijzen we
  body: Elk traject begint met een vaste-scope start — een vast bedrag voor een vaste periode, met een evaluatierapport met gemeten prestaties als resultaat. Daarna volgt beheer per verwerkte eenheid, soms aangevuld met een abonnement. Geen uurtje-factuurtje, geen open einde. AI die werk oplevert, geen slides.
cards:
  - name: "Azure Waste Audit: 2-Wk Assessment"
    scope: Een grondige analyse van je Azure-uitgaven — wat je betaalt, waarom, en waar het anders kan.
    deliverables:
      - Gekwantificeerde besparingsinventaris, met een bedrag per bevinding
      - Ondertekende baseline- en meetmethodiek
      - Een lijst met AI-use-cases die je uit de besparing kunt financieren
    duration: 2 weken
    price: "€7.500 – €12.500, vaste prijs"
    afterNote: "Daarna kies je: een vaste-prijs implementatie, of gainshare — 50% van de geverifieerde besparing gedurende 6 maanden (commerciële hefbomen zoals reserveringen tellen voor [15–20%]; ondergrens vanaf [€80–100k]/maand Azure-uitgaven). Vanaf maand 7 een Cost Guardrail-abonnement [€x/maand]."
  - name: "[PoC-aanbod documentverwerking]: 4-6-Wk Proof of Concept"
    scope: Een werkende documentverwerkings-oplossing in jouw eigen Azure-omgeving, met gemeten nauwkeurigheid per documenttype.
    deliverables:
      - Werkende oplossing in je eigen tenant
      - Evaluatierapport met gemeten prestaties
      - Duidelijkheid over de vervolgkosten per verwerkte eenheid
    duration: 4-6 weken
    price: "[€x], vaste prijs"
    afterNote: "Daarna beheer per verwerkte eenheid, [€x per document/order]."
  - name: "[AI-offer 3 — naam en scope nog te bepalen]"
    scope: "[Scope nog te bepalen door de eigenaar]"
    deliverables:
      - "[Op te stellen]"
    duration: "[x]"
    price: "[x]"
    afterNote: "[x]"
  - name: AI Operations
    scope: "Beheerabonnement voor AI in productie: monitoring, evaluaties, kostenbeheersing en doorontwikkeling."
    deliverables:
      - Continue monitoring van modelprestaties
      - Periodieke evaluaties
      - Kostenbeheersing op AI-uitgaven
      - Doorontwikkeling waar nodig
    duration: Doorlopend
    price: "[€x/maand of % van run-volume]"
    afterNote: Loopt door zolang de AI-oplossing in productie draait.
guarantee:
  heading: Wat we garanderen — en wat niet
  body: Een evaluatierapport met gemeten prestaties is altijd onderdeel van elk traject. Geen resultaat? Dan zeggen we dat — we verkopen geen vervolgtraject op basis van een verhaal, alleen op basis van cijfers.
