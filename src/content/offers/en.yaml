meta:
  title: Offers & pricing — First Line Software
  description: Fixed-scope start, real prices, no billable hours. Two ways to lower your Azure costs — the free Waste Scan and the human-led Waste Audit.
heading: Offers & pricing
intro:
  body: "Every engagement starts with a fixed-scope start: a fixed amount for a fixed period. An evaluation report of measured performance is always part of it — and if it turns up nothing, we say so. We don't sell a follow-on engagement on a story, only on numbers. No billable hours, no open-ended scope. AI that delivers work, not slides."
tiles:
  - name: Azure Waste Scan
    tagline: Step 1 — run it yourself, right in your own browser. No upload, no sign-up.
    whatYouGetLabel: "What you get:"
    outcome: Answers within minutes
    outcomeBody: A short list of leads with an amount per finding, as a PDF. Your file never leaves your browser — we never see your numbers.
    price: Free · 2 minutes
    ctaLabel: Run the free scan
    target: azureScan
  - name: Azure Waste Audit
    tagline: Step 2 — our engineers dig into your usage and validate what is genuinely recoverable.
    whatYouGetLabel: "What you get:"
    outcome: A savings case that holds up
    outcomeBody: A quantified savings inventory with a signed measurement methodology, plus a list of AI use cases you could fund from those savings.
    price: €7,500 – €12,500 · 2 weeks
    ctaLabel: See the audit
    target: azureAudit
azureNote:
  body: "The two belong together: step 1 shows whether there is anything to recover, step 2 attaches amounts you can defend."
  linkLabel: See how the Azure track works
